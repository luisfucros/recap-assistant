server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match the API's own upload cap (Settings.max_upload_bytes, 50 MB) — nginx's
    # default (1 MB) is far tighter, so without this every real document upload
    # would be rejected here with nginx's generic "413 Request Entity Too Large"
    # page before ever reaching the API's own size check and JSON error body.
    client_max_body_size 50m;

    # SPA client-side routing: serve index.html for unmatched paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames (e.g. index-a1b2c3.js), so a new
    # build always yields new URLs — they can be cached forever without ever
    # serving a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry HTML is the one file whose URL never changes; it must not be
    # cached, or the browser keeps loading the previous build's (now-gone) hashed
    # assets after a redeploy. no-store forces a fresh fetch every load.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Reverse-proxy the API so the SPA and API share an origin (httpOnly cookies).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
