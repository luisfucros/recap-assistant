# Prometheus scrape config. Targets are reached by compose service name.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The API exposes /metrics once the metrics scaffold lands; the target simply
  # reads as "down" until then.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:9808"]

  - job_name: eval
    static_configs:
      - targets: ["eval:9809"]
